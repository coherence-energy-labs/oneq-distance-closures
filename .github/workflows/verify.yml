name: integrity

# THE STRUCTURAL FIX. Three consecutive releases shipped an artifact that did
# not match its own description, and every one was caught by a human -- twice
# by an external reviewer -- because the only validation ran on the machine
# where the artifact was authored. This job runs on a machine that authored
# nothing: clean clone, manifest, challenge, and a diff of the repo copy
# against the extracted release archive. It would have caught all of them.

on: [push, pull_request, workflow_dispatch]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r $(ls -d oneq-ibm-distance-closures-v*/ | tail -1)REQUIREMENTS.txt

      - name: pin files are exactly 64 hex + LF (four CR bugs deep)
        run: |
          for f in PIN_ARCHIVE.txt challenge/RELEASE_PIN.txt; do
            sz=$(wc -c < "$f")
            if [ "$sz" -ne 65 ]; then echo "$f is $sz bytes, want 65 (64 hex + LF; CRLF would be 66)"; exit 1; fi
            if ! grep -qE '^[0-9a-f]{64}$' "$f"; then echo "$f is not 64 lowercase hex"; exit 1; fi
            echo "$f OK (65 bytes, bare hex)"
          done

      - name: manifest -- every file matches SHA256SUMS
        run: cd $(ls -d oneq-ibm-distance-closures-v*/ | tail -1) && sha256sum -c SHA256SUMS

      - name: verifier -- 6/6 PROMOTABLE from a clean checkout
        run: |
          cd $(ls -d oneq-ibm-distance-closures-v*/ | tail -1)
          PYTHONPATH=. python verifiers/verify_closures.py | tee /tmp/v.txt
          grep -q "6/6 PROMOTABLE" /tmp/v.txt

      - name: challenge -- VALID accepted, all seven forgeries rejected
        run: cd challenge && bash verify.sh

      - name: tree pin -- matches the published PIN
        run: |
          cd challenge
          grep -q "$(cat RELEASE_PIN.txt)" verification_report.json

      - name: archive parity -- repo copy == published release bytes
        run: |
          V=$(ls -d oneq-ibm-distance-closures-v*/ | tail -1 | tr -d /)
          URL=https://github.com/coherence-energy-labs/oneq-distance-closures/releases/download/${V##*-}/$V.tar.gz
          curl -sfL -o a.tgz "$URL" || { echo 'release asset not reachable; skipping'; exit 0; }
          echo "$(cat PIN_ARCHIVE.txt)  a.tgz" | sha256sum -c -
          mkdir -p x && tar xzf a.tgz -C x
          diff -r -x __pycache__ -x '*.pyc' "$V" "x/$V"
          echo 'repo copy and published archive are identical'
